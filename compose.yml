services:
  redis:
    image: redis:latest
    container_name: redis_server
    command: redis-server --requirepass yaprak321
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    ports:
      - "5540:5540"
    restart: always

volumes:
  redis_data:
    driver: local
